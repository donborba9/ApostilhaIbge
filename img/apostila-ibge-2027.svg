<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#22304A"/>
      <stop offset="0.6" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#0A1322"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F5A400" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5A400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3A58"/>
      <stop offset="0.55" stop-color="#16243B"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1322"/>
      <stop offset="1" stop-color="#1A2840"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#F5A400"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#3A475C"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#dots)" opacity="0.45"/>
  <circle cx="540" cy="640" r="520" fill="url(#glow)"/>

  <!-- Elementos estatísticos decorativos -->
  <g opacity="0.18" stroke="#D5DBE6" fill="none" stroke-width="3">
    <polyline points="40,1010 120,960 190,985 260,900 330,930 400,850"/>
    <circle cx="960" cy="1000" r="70"/>
    <path d="M960 930 A70 70 0 0 1 1027 1020 L960 1000 Z" fill="#D5DBE6"/>
    <rect x="70" y="430" width="22" height="70"/><rect x="104" y="400" width="22" height="100"/><rect x="138" y="360" width="22" height="140"/>
  </g>
  <g opacity="0.22" fill="#D5DBE6" font-weight="700" font-size="34">
    <text x="60" y="320">%</text>
    <text x="980" y="640">Σ</text>
    <text x="900" y="1150">x̄</text>
    <text x="60" y="1180">σ²</text>
  </g>

  <!-- Título superior -->
  <text x="540" y="105" text-anchor="middle" fill="#D5DBE6" font-size="34" font-weight="500" letter-spacing="2">PREPARE-SE PARA O</text>
  <text x="540" y="180" text-anchor="middle" fill="#FFFFFF" font-size="68" font-weight="900">CONCURSO <tspan fill="#F5A400">IBGE 2027</tspan></text>

  <!-- Livro / Apostila -->
  <g transform="translate(300 250) rotate(-5)" filter="url(#shadow)">
    <!-- páginas -->
    <polygon points="470,8 500,22 500,692 470,680" fill="#E9EDF3"/>
    <g stroke="#D5DBE6" stroke-width="1.2">
      <line x1="474" y1="30" x2="474" y2="676"/><line x1="480" y1="30" x2="480" y2="680"/>
      <line x1="486" y1="30" x2="486" y2="684"/><line x1="492" y1="30" x2="492" y2="688"/>
    </g>
    <polygon points="0,680 470,680 500,692 30,692" fill="#DDE2EA"/>
    <!-- lombada -->
    <polygon points="-46,14 0,0 0,680 -46,694" fill="url(#spine)"/>
    <rect x="-38" y="60" width="30" height="8" fill="#F5A400"/>
    <rect x="-38" y="620" width="30" height="8" fill="#F5A400"/>
    <text transform="translate(-17 350) rotate(-90)" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="4">APOSTILA IBGE 2027</text>

    <!-- capa -->
    <rect x="0" y="0" width="470" height="680" rx="4" fill="url(#cover)"/>
    <rect x="0" y="0" width="470" height="680" rx="4" fill="url(#dots)" opacity="0.35"/>
    <rect x="0" y="0" width="14" height="680" fill="#000" opacity="0.25"/>

    <!-- faixa superior -->
    <rect x="34" y="40" width="250" height="40" rx="20" fill="#F5A400"/>
    <text x="159" y="67" text-anchor="middle" fill="#0F1B2D" font-size="17" font-weight="800" letter-spacing="2">APOSTILA COMPLETA</text>

    <text x="36" y="150" fill="#FFFFFF" font-size="40" font-weight="800" letter-spacing="3">CONCURSO</text>
    <text x="30" y="290" fill="url(#amber)" font-size="158" font-weight="900" letter-spacing="-4">IBGE</text>
    <text x="34" y="390" fill="none" stroke="#FFFFFF" stroke-width="3" font-size="112" font-weight="900" letter-spacing="2">2027</text>

    <!-- gráfico de barras crescente -->
    <g transform="translate(330 300)">
      <rect x="0" y="70" width="22" height="50" rx="3" fill="#3A475C"/>
      <rect x="30" y="40" width="22" height="80" rx="3" fill="#5A6B88"/>
      <rect x="60" y="10" width="22" height="110" rx="3" fill="#F5A400"/>
      <rect x="90" y="-25" width="22" height="145" rx="3" fill="#FFC233"/>
      <polyline points="11,60 41,30 71,0 101,-40" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="101,-40 88,-36 98,-27" fill="#FFFFFF"/>
    </g>

    <line x1="36" y1="425" x2="434" y2="425" stroke="#F5A400" stroke-width="2" opacity="0.7"/>

    <!-- conteúdos -->
    <g font-size="20" fill="#E9EDF3" font-weight="600">
      <g transform="translate(36 465)"><circle cx="10" cy="-6" r="10" fill="#F5A400"/><path d="M5 -6 l4 4 l7 -8" stroke="#0F1B2D" stroke-width="2.5" fill="none"/><text x="30">Língua Portuguesa</text></g>
      <g transform="translate(250 465)"><circle cx="10" cy="-6" r="10" fill="#F5A400"/><path d="M5 -6 l4 4 l7 -8" stroke="#0F1B2D" stroke-width="2.5" fill="none"/><text x="30">Raciocínio Lógico</text></g>
      <g transform="translate(36 505)"><circle cx="10" cy="-6" r="10" fill="#F5A400"/><path d="M5 -6 l4 4 l7 -8" stroke="#0F1B2D" stroke-width="2.5" fill="none"/><text x="30">Geografia</text></g>
      <g transform="translate(250 505)"><circle cx="10" cy="-6" r="10" fill="#F5A400"/><path d="M5 -6 l4 4 l7 -8" stroke="#0F1B2D" stroke-width="2.5" fill="none"/><text x="30">Ética no Serviço</text></g>
      <g transform="translate(36 545)"><circle cx="10" cy="-6" r="10" fill="#F5A400"/><path d="M5 -6 l4 4 l7 -8" stroke="#0F1B2D" stroke-width="2.5" fill="none"/><text x="30">Conhecimentos Técnicos e Estatística</text></g>
    </g>

    <!-- rodapé da capa -->
    <rect x="0" y="600" width="470" height="80" fill="#F5A400"/>
    <text x="235" y="633" text-anchor="middle" fill="#0F1B2D" font-size="17" font-weight="800" textLength="410" lengthAdjust="spacingAndGlyphs">TEORIA • QUESTÕES COMENTADAS • SIMULADOS</text>
    <text x="235" y="660" text-anchor="middle" fill="#0F1B2D" font-size="15" font-weight="600">Agente e Supervisor de Pesquisas</text>

    <!-- brilho -->
    <rect x="0" y="0" width="470" height="680" fill="url(#shine)"/>
  </g>

  <!-- Selo de salário -->
  <g transform="translate(830 340) rotate(10)" filter="url(#soft)">
    <circle r="132" fill="#F5A400"/>
    <circle r="116" fill="none" stroke="#0F1B2D" stroke-width="3" stroke-dasharray="6 7"/>
    <text y="-48" text-anchor="middle" fill="#0F1B2D" font-size="22" font-weight="800" letter-spacing="2">SALÁRIOS</text>
    <text y="-20" text-anchor="middle" fill="#0F1B2D" font-size="22" font-weight="800" letter-spacing="2">DE ATÉ</text>
    <text y="44" text-anchor="middle" fill="#0F1B2D" font-size="54" font-weight="900" textLength="200" lengthAdjust="spacingAndGlyphs">R$ 4 MIL</text>
    <text y="80" text-anchor="middle" fill="#0F1B2D" font-size="20" font-weight="700">por mês</text>
  </g>

  <!-- Selo secundário -->
  <g transform="translate(205 905) rotate(-8)" filter="url(#soft)">
    <rect x="-125" y="-42" width="250" height="84" rx="16" fill="#FFFFFF"/>
    <text y="-6" text-anchor="middle" fill="#0F1B2D" font-size="26" font-weight="900">+ 1.500</text>
    <text y="24" text-anchor="middle" fill="#3A475C" font-size="18" font-weight="600">questões resolvidas</text>
  </g>

  <!-- Chamada inferior -->
  <text x="540" y="1100" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="800">Sua vaga no IBGE começa aqui.</text>
  <text x="540" y="1150" text-anchor="middle" fill="#D5DBE6" font-size="26" font-weight="500">Conteúdo completo, atualizado e direto ao ponto.</text>

  <g transform="translate(540 1235)">
    <rect x="-270" y="-42" width="540" height="84" rx="42" fill="url(#amber)" filter="url(#soft)"/>
    <text y="11" text-anchor="middle" fill="#0F1B2D" font-size="30" font-weight="900" letter-spacing="1">GARANTA SUA APOSTILA  →</text>
  </g>

  <text x="540" y="1322" text-anchor="middle" fill="#3A475C" font-size="15">Material preparatório independente, sem vínculo oficial com o IBGE.</text>
</svg>
